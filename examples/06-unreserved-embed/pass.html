<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unreserved embed, corrected</title>
  <style>
    /* The wrapper holds the space whether or not the embed ever arrives, so
       a slow or failed third party costs a gap rather than a shift. Measure
       the real rendered height rather than guessing: reserving too little
       still shifts, and reserving too much leaves a hole on every visit. */
    .booking-slot { min-height: 420px; }
    .booking { border: 0; width: 100%; height: 420px; }
  </style>
</head>
<body>
  <h1>Reserve a table</h1>
  <div class="booking-slot">
    <iframe class="booking" src="https://bookings.example/widget"
            title="Booking form" width="600" height="420" loading="lazy"></iframe>
  </div>
  <p>Groups of eight or more, please call.</p>
</body>
</html>
