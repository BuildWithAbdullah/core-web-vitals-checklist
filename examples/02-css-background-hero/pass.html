<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Background hero, corrected</title>
  <style>
    .hero { position: relative; min-height: 60vh; }
    .hero__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero__text { position: relative; }
  </style>
</head>
<body>
  <section class="hero">
    <!-- The same visual result, but the URL is now in the HTML where the
         preload scanner finds it during the first parse, before CSS has even
         been requested. object-fit does the cropping that background-size
         was doing. -->
    <img class="hero__image" src="/media/hero-1600.webp"
         alt="Harvest table set for a tasting"
         fetchpriority="high" width="1600" height="900">
    <div class="hero__text"><h1>Autumn tasting menu</h1></div>
  </section>
</body>
</html>
