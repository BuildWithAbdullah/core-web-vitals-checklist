<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Injected banner, corrected</title>
  <style>
    /* The space exists from the first paint. The banner is hidden rather
       than absent, so revealing it moves nothing. */
    .promo {
      background: #1f2937;
      color: #fff;
      padding: 16px;
      min-height: 56px;
      visibility: hidden;
    }
    .promo[data-ready] { visibility: visible; }
  </style>
</head>
<body>
  <div class="promo" id="promo" aria-live="polite"></div>
  <h1>Autumn tasting menu</h1>
  <p>Six courses, served from six until ten, Wednesday to Sunday.</p>

  <script>
    // Filling a box that already exists costs no layout shift. If the
    // banner turns out not to be needed the reserved strip is wasted space,
    // which is the honest trade: a predictable gap instead of an
    // unpredictable jump.
    const node = document.getElementById('promo');
    node.textContent = 'Two for one on Wednesdays';
    node.setAttribute('data-ready', '');
  </script>
</body>
</html>
