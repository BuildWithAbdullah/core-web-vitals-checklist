name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No install step. The repository has no dependencies, which is the
      # point: a CI run that cannot break because a registry had a bad
      # afternoon is a CI run whose red means something.
      - name: Assert there is nothing to install
        run: |
          if [ -f package-lock.json ] || [ -d node_modules ]; then
            echo "This repository is meant to have no dependencies."
            exit 1
          fi
          echo "No dependencies, as intended."

      - name: Unit tests and example pairs
        run: npm test

      - name: Repository invariants
        run: npm run verify

      # The browser entry point is the one file the tests do not import,
      # because it talks to the DOM and pulls web-vitals over the network.
      # It is parsed as a module from stdin rather than with `node --check`
      # on the path, because older Node versions decide module type from the
      # file extension there and this file is .js.
      - name: Syntax-check the browser entry point
        run: node --input-type=module --check < measure/collect-web-vitals.js
