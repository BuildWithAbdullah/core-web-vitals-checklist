name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No install step. The repository has no dependencies, which is the
      # point: a CI run that cannot break because a registry had a bad
      # afternoon is a CI run whose red means something.
      - name: Assert there is nothing to install
        run: |
          if [ -f package-lock.json ] || [ -d node_modules ]; then
            echo "This repository is meant to have no dependencies."
            exit 1
          fi
          echo "No dependencies, as intended."

      - name: Unit tests and example pairs
        run: npm test

      - name: Repository invariants
        run: npm run verify

      - name: Syntax-check the browser entry point
        run: node --check measure/collect-web-vitals.js
